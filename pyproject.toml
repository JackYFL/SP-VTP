[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sp-vtp"
version = "0.2.0"
description = "Vision-conditioned trajectory prediction for egocentric manipulation data."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "timm>=0.9.7",
    "diffusers>=0.18.2",
    "einops>=0.6.1",
    "omegaconf>=2.3",
    "pyyaml>=6.0",
    "numpy>=1.26,<2.0",
    "matplotlib>=3.8",
    "opencv-contrib-python>=4.8",
    "zarr>=2.16,<3.0",
    "tqdm>=4.65",
    "accelerate>=0.24",
]

[project.scripts]
spvtp = "spvtp.cli:main"

[project.optional-dependencies]
annotation = [
    "pillow>=10.0",
]
data = [
    "av>=10.0",
    "colorama>=0.4",
    "ffmpeg-python>=0.2",
    "click>=8.0",
    "depthai>=2.24,<3",
    "flask>=2.3",
    "flask-socketio>=5.3",
    "hydra-core>=1.3",
    "imagecodecs>=2023.0",
    "numcodecs>=0.11",
    "open3d>=0.18",
    "pandas>=2.0",
    "pillow>=10.0",
    "plotly>=5.0",
    "scipy>=1.10",
]
dev = [
    "pytest>=7.0",
]
tracking = ["wandb>=0.15"]
iphone = ["record3d"]
vla = ["transformers", "safetensors", "sentencepiece", "peft"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"spvtp.vision_traj.configs" = ["*.yaml"]
"spvtp.demonstration_processing" = ["config/*.yaml", "calibration/*.yaml", "calibration/*.json"]

[tool.setuptools.packages.find]
where = ["."]
include = ["spvtp*"]
